apiVersion: v1
kind: Namespace
metadata:
  name: llmdbench
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devbox
  namespace: llmdbench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devbox-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: devbox
    namespace: llmdbench
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devbox-data
  namespace: llmdbench
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: csi-manila-nfs
  resources:
    requests:
      storage: 128Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
  namespace: llmdbench
  labels:
    app: devbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devbox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: devbox
    spec:
      serviceAccountName: devbox
      containers:
        - name: devbox
          image: ghcr.io/llm-d/llm-d-benchmark:v0.7.0
          workingDir: /workspace/llm-d-benchmark
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              if ! command -v tmux >/dev/null 2>&1; then
                apt-get update && apt-get install -y tmux \
                  && apt-get clean && rm -rf /var/lib/apt/lists/* || true
              fi
              
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              mkdir -p "$HOME/.kube"
              kubectl config set-cluster in-cluster \
                --server="https://kubernetes.default.svc" \
                --certificate-authority="$SA/ca.crt" --embed-certs=true >/dev/null
              kubectl config set-credentials devbox \
                --token="$(cat $SA/token)" >/dev/null
              kubectl config set-context in-cluster \
                --cluster=in-cluster --user=devbox \
                --namespace="$(cat $SA/namespace)" >/dev/null
              kubectl config use-context in-cluster >/dev/null
              
              MIRROR=/tmp/tmux-mirror.log
              : > "$MIRROR"
              tmux new-session -d -s bench
              tmux pipe-pane -o -t bench "cat >> $MIRROR"
              exec tail -F "$MIRROR"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /root/data
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: workspace
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: devbox-data
