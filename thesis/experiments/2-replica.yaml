experiment:
  name: 2-replica
  harness: inference-perf

setup:
  constants:
    decode.replicas: 2

  treatments:
    - name: none
      gateway.className: none

    - name: llmd-active-request
      router.epp.pluginsConfigFile: active-request.yaml

    - name: aibrix-least-kv-cache
      gateway.className: aibrix
      router.inferencePool.create: false
      aibrix.gatewayPlugin.container.envs.ROUTING_ALGORITHM: least-kv-cache

treatments:
  - name: batch-summarization-rag
    profile: ../../../thesis/profiles/inference-perf/batch-summarization-rag.yaml
    load.stages:
      - concurrent_sessions: 0
        session_rate: 1.50
        num_sessions: 90
        timeout: 60
      - concurrent_sessions: 0
        session_rate: 0.75
        num_sessions: 338
        timeout: 450
      - concurrent_sessions: 0
        session_rate: 0.85
        num_sessions: 383
        timeout: 450
      - concurrent_sessions: 0
        session_rate: 1.00
        num_sessions: 450
        timeout: 450
      - concurrent_sessions: 0
        session_rate: 1.15
        num_sessions: 518
        timeout: 450
      - concurrent_sessions: 0
        session_rate: 1.30
        num_sessions: 585
        timeout: 450
      - concurrent_sessions: 0
