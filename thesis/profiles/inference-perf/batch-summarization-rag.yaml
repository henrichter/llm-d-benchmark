load:
  type: concurrent
data:
  type: conversation_replay
  conversation_replay:
    seed: 42
    num_conversations: 30
    shared_system_prompt_len: 500
    turns_per_conversation:
      type: fixed
      mean: 1
    input_tokens_per_turn:
      type: normal
      min: 1000
      max: 80000
      mean: 15000
      std_dev: 22000
    output_tokens_per_turn:
      type: normal
      min: 50
      max: 2000
      mean: 500
      std_dev: 300
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
  base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
