load:
  type: concurrent
data:
  type: conversation_replay
  conversation_replay:
    seed: 42
    num_conversations: 5
    shared_system_prompt_len: 2000
    dynamic_system_prompt_len:
      type: lognormal
      min: 2000
      max: 150000
      mean: 45000
      std_dev: 35000
    turns_per_conversation:
      type: normal
      min: 2
      max: 50
      mean: 15
      std_dev: 8.5
    input_tokens_per_turn:
      type: lognormal
      min: 500
      max: 15000
      mean: 3000
      std_dev: 2500
    output_tokens_per_turn:
      type: normal
      min: 50
      max: 4000
      mean: 300
      std_dev: 850
    tool_call_latency_sec:
      type: normal
      min: 5
      max: 60
      mean: 25
      std_dev: 12
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: REPLACE_ENV_LLMDBENCH_DEPLOY_CURRENT_MODEL
  base_url: REPLACE_ENV_LLMDBENCH_HARNESS_STACK_ENDPOINT_URL
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
